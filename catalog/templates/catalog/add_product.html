{% extends 'catalog/base.html' %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Добавить товар</h1>
</div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-9 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Введите данные продукта</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="" enctype="multipart/form-data" class="form-floating">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name">Название</label>
                            <input type="text" name="name" class="form-control" id="name" placeholder="Название продукта" required>
                        </div>
                        <div class="mb-3">
                            <label for="description">Описание</label>
                            <textarea type="text" name="description" class="form-control" id="description" placeholder="Описание продукта" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="category">Категория</label>
                            <select name="category" class="form-control" id="category" required>
                                <option value="" disabled selected hidden>Выберите категорию</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="price">Цена</label>
                            <div class="input-group">
                                <input type="number" name="price" step="0.01" class="form-control" id="price" placeholder="Введите цену продукта в долларах" required>
                                <span class="input-group-text">$</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="image">Изображение</label>
                            <input type="file" name="image" class="form-control" id="image" placeholder="Загрузите изображение продукта" required>
                        </div>
                        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Отправить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
